name: Research package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  public-reproduction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip==25.2
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: make lint
      - run: make test
      - run: make all
      - uses: actions/upload-artifact@v4
        with:
          name: aggregate-report-reproduction
          path: build/reproduction/
