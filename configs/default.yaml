common_scorer:
  preprocessing: train_only_standard_scaler_per_modality
  modality_blocks:
    video: {input_dim: 1024, linear_output_dim: 8, layer_norm: true, activation: gelu}
    audio: {input_dim: 1536, linear_output_dim: 8, layer_norm: true, activation: gelu}
    text: {input_dim: 768, linear_output_dim: 8, layer_norm: true, activation: gelu}
  fusion: concatenate_24_dimensions
  head: {linear_input_dim: 24, output_dim: 1, activation: sigmoid}
  trainable_parameter_count: 26721
  low_capacity_reason: 69_independent_participants
  initialization: {linear_weight: xavier_uniform, linear_bias: zero, layer_norm_weight: one, layer_norm_bias: zero}

training:
  participant_batch_size: 16
  session_rows_per_full_batch: 32
  both_sessions_enter_batch_together: true
  optimizer: adamw
  learning_rate: 1.0e-3
  weight_decay: 1.0e-2
  maximum_epochs: 200
  early_stopping_patience: 25
  checkpoint_metric: validation_srcc
  checkpoint_direction: maximize
  exact_tie_break: earliest_epoch
  gradient_norm_clip: 1.0

arl:
  method_status: transparent_project_adaptation_not_exact_reproduction
  learner:
    common_scorer_trainable_parameters: 26721
    fused_representation_dimensions: 24
  adversary:
    input: [detached_fused_representation_24, detached_normalised_continuous_target_1]
    architecture: linear_25_to_1_then_sigmoid
    initialization: {linear_weight: xavier_uniform, linear_bias: zero}
    trainable_parameters: 26
    forbidden_inputs: [prediction, per_example_loss, proxy_group, protected_annotation]
  weighting:
    scope: current_session_row_minibatch
    formula: 1_plus_sigmoid_logit_divided_by_max_batch_mean_sigmoid_logit_and_1e_minus_4
    denominator_guard: 1.0e-4
    learner_weight_detached: true
    reduction: mean_weight_times_per_row_mse_not_weight_sum
  optimization:
    learner_only_minibatch_updates: 6
    subsequent_order: learner_then_recompute_detached_current_state_then_adversary
    learner_optimizer: separate_adamw_with_common_project_settings
    adversary_optimizer: separate_adamw_with_common_project_settings
    gradient_norm_clip_separate: {learner: 1.0, adversary: 1.0}
    sampler: ordinary_participant_paired_with_complete_remainder
  checkpoint:
    metric: unweighted_validation_srcc
    exact_tie_break: earliest_epoch
    save: [learner, adversary, learner_optimizer, adversary_optimizer, scalers, phase, diagnostics]
  diagnostics:
    timing_version: arl_diagnostics_v1
    timing: weighting_and_learner_metrics_pre_learner_step_adversary_objective_and_gradient_post_learner_step_pre_adversary_step
    minibatch:
      - learner_and_adversary_objectives
      - adversary_logit_and_sigmoid_score_mean_min_max
      - guarded_weight_denominator
      - weight_mean_min_max
      - weight_effective_sample_size
      - weight_error_pearson_or_null
      - mean_absolute_within_pair_weight_difference
      - learner_and_adversary_preclip_gradient_norms
      - phase_and_update_counts
    epoch: [aggregated_minibatch_diagnostics, validation_srcc, validation_mse]
    undefined_value: null
    serialization: canonical_json_utf8_in_fit_artifact_and_prediction_manifest
  protected_annotation_access: forbidden
  proxy_access: forbidden

pseudo_group:
  join_unit: participant
  sources:
    face: mean_session_dinov2_summary_per_participant
    audio_session: mean_session_wavlm_summary_per_participant
  fit_scope: training_participants_only_per_outer_fold
  preprocessing: train_only_standard_scaler
  kmeans:
    n_clusters: 2
    init: k-means++
    n_init: 20
    max_iter: 300
    tol: 1.0e-4
    algorithm: lloyd
    random_state: 0
  held_out_assignment: unchanged_scaler_and_nearest_frozen_centre
  both_sessions_share_assignment: true
  cluster_identity_claim: forbidden
  random_proxy:
    salt: fair-avi-mit-random-proxy-v1
    assignment: global_hash_rank_first_34_group_0_remaining_35_group_1
    fold_role_or_seed_dependency: forbidden
  balanced_sampler:
    participant_batch_size: 16
    participants_per_group: 8
    session_rows_per_batch: 32
    session_rows_per_group: 16
    policy: deterministic_seeded_cyclic_shuffle
    state: single_continuous_state_across_epoch_boundaries
    no_repeat_before_group_exhaustion: true
    duplicate_within_half_batch_only_if_group_size_below_8: true
    require_both_groups_nonempty: true
    optimizer_steps_per_epoch: ceil_training_participant_count_divided_by_16
    checkpoint_resume: restore_model_optimizer_scalers_regenerate_schedule_and_advance_saved_draw_count
    validation_sampling: complete_natural_role_distribution
    test_sampling: complete_natural_role_distribution
    report: [unique_participant_rate, duplication_rate]

configurations:
  firewalled:
    - erm
    - face_sampling_only
    - audio_session_sampling_only
    - random_proxy_w1
    - face_w1
    - audio_session_w1
    - arl
  conditional_supervised_oracle: protected_attribute_w1_oracle
  oracle_minimum_reportable_training_groups: 2
  deterministic_floors:
    - mean
    - phase_mean
    - ridge_video
    - ridge_audio
    - ridge_text
    - ridge_video_audio
    - ridge_video_text
    - ridge_audio_text
    - ridge

ridge_floor:
  input: concatenated_session_video_1024_audio_1536_text_768
  preprocessing: train_session_rows_standard_scaler
  estimator: sklearn_ridge
  alpha: 1.0
  fit_intercept: true
  solver: lsqr
  tolerance: 1.0e-6
  maximum_iterations: 10000
  target: normalised_recommend_hiring
  fit_scope: one_participant_safe_fit_per_rotation
  tuning_or_refit: forbidden

run_budget:
  firewalled: {configurations: 7, folds: 5, seeds: 3, fits: 105}
  conditional_supervised_oracle: {configurations: 1, folds: 5, seeds: 3, fits: 15}
  learned_fit_maximum: 120
  diagnostic_floors_outside_learned_matrix: 9
  out_of_fold_predictions_per_configuration_seed_if_all_69_eligible: 138
  out_of_fold_predictions_per_configuration_all_seeds_if_all_69_eligible: 414

loss:
  task: mse_on_normalised_recommend_hiring
  lambda_w: 0.02
  lambda_sweep: false
  schedule: fixed_from_first_update
  w1_groups: binary_training_proxy_only
  sampling_only: unweighted_task_mse_without_proxy_group_objective_access
  w1_objective: task_mse_plus_lambda_w_times_exact_balanced_empirical_w1
  adversarial_component_for_proxy_configurations: forbidden

evaluation:
  utility: [srcc, pearson, mae_normalised, mae_raw_scale, rmse]
  primary_utility: srcc
  secondary_utility: [pearson, mae_normalised, mae_raw_scale, rmse]
  primary_contrast_summary:
    statistic: arithmetic_mean_of_three_within_seed_paired_deltas
    show_seed_specific_deltas: true
    recompute_inside_each_participant_bootstrap_replicate: true
  paired_condition_diagnostic:
    quantity: predicted_and_observed_post_minus_pre_recommend_hiring
    interpretation: descriptive_noncausal
  participant_cluster_bootstrap:
    resamples: 10000
    random_state: 2026
    confidence_level: 0.95
  protected_audit:
    metric: maximum_pairwise_empirical_w1
    minimum_independent_participants_per_reported_category: 10
    multi_category_without_forced_binarisation: true
    two_group_spdd_is_special_case: true
    unknown_is_valid: true

annotation:
  join_unit: participant
  minimum_independent_raters: 3
  stimulus_targets: [0.2, 0.5, 0.8]
  images_per_session: 3
  packet_size: 6
  packet_not_assessable_if_either_session_has_fewer_than_3_distinct_valid_crops: true
  offset_sensitivity_seconds: 30
  manual_fields:
    - perceived_gender_presentation
    - perceived_racialised_appearance
    - perceived_skin_tone
    - cannot_determine
    - gender_presentation_confidence
    - racialised_appearance_confidence
    - skin_tone_confidence
  separately_sourced_fields: [self_reported_gender, self_reported_ethnicity]
  manual_inference_prohibited: [ethnicity, religion, nationality, citizenship, disability, sexual_orientation]
