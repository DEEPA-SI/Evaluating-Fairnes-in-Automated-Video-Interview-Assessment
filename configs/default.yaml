# Frozen planning contract for the MIT Interview participant-grouped study.
# Values become run evidence only through immutable result manifests.

seeds: [1, 11, 21]

study:
  corpus: mit_interview
  construct: crowd_perceived_hireability_not_actual_hiring
  primary_outcome:
    source_column: RecommendHiring
    worker_row: AGGR
    raw_scale: [1, 7]
    normalisation: (raw-1)/6
    preserve_raw_value: true
  condition: [pre, post]
  condition_interpretation: descriptive_paired_not_causal_coaching_effect
  independence_unit: participant

cross_fitting:
  folds: 5
  assignment_salt: fair-avi-mit-fold-v1
  canonical_participant_id: ascii_decimal_without_prefix_or_leading_zero
  assignment: sort_sha256_salt_nul_participant_then_rank_mod_5
  expected_fold_sizes: [14, 14, 14, 14, 13]
  split_seed: none_fixed_manifest
  role_rotation:
    test: f
    validation: (f+1)%5
    train: remaining_three_folds
  both_sessions_share_fold: true
  model_and_sampler_seeds_only: [1, 11, 21]

data:
  raw_dir: ../../datasets/mit-interview
  feature_dir: features/mit-interview
  expected_participants: 69
  expected_sessions: 138
  session_mapping: src/data/mit_source_session_map.json
  identity_join_audit: data/restricted/mit_identity_join_audit.json
  transcript_source: supplied_turker_dialogue_candidate_markers_only
  audio_source: supplied_active_interview_audio_not_candidate_voice
  primary_pipeline_uses_supplied_legacy_features: false
  supplied_legacy_features_inventory_only: [Facial_Features, SmileData, Prosody]
  protected_annotations:
    supplied_by_corpus: false
    join_unit: participant
    ordinary_training_access: forbidden
    firewalled_predictions_and_proxies_lock_before_annotation_join: true
    annotation_fields_never_select_model_or_proxy: true

feature_extraction:
  schema_version: fair-avi-mit-feature-shard-4
  extractor_version: fair-avi-mit-extractor-4
  seed: 2026
  source_date_epoch_required: true
  face_crops_manifest: face_crops.json
  candidate_face_context:
    subject_role: candidate
    source_grid_hz: 1
    maximum_samples: 128
    selection: endpoint_rank_over_candidate_valid_indices_within_active_interval
    spans_endpoints: true
    missing_selected_face_policy: record_reason_and_exclude_before_valid_rank_selection
    uncropped_frame_fallback: forbidden
    selector:
      name: insightface/scrfd-10gf
      revision: 7fadd420c2351d0ffa8cac403421c1a3ed733365
      artifact_release: v0.7
      artifact_url: https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_l.zip
      archive_sha256: 80ffe37d8a5940d59a7384c201a2a38d4741f2f3c51eef46ebb28218a7b0ca2f
      artifact_file: det_10g.onnx
      artifact_sha256: 5838f7fe053675b1c7a08b633df49e7af5495cee0493c7dcf6697200b85b5b91
      artifact_size_bytes: 16923827
      input_size: [640, 640]
      preprocessing: bgr_resize_aspect_pad_top_left_blob_mean_127.5_std_128_swap_rb
      decoding: multi_stride_distance2bbox_then_nms
      confidence_threshold: 0.5
      nms_threshold: 0.4
      principal_face_rule: per_second_unique_most_central_with_margin
      candidate_centrality_max_ratio: 0.35
      candidate_centrality_margin_ratio: 0.05
      scan_fps: 1
      first_valid_max_seconds: 30
      minimum_active_elapsed_seconds: 60
      terminal_invalid_run_seconds: 30
      minimum_valid_candidate_seconds: 32
      active_interval_rule: first_valid_then_first_terminal_invalid_run
      retained_grid_rule: valid_active_indices_endpoint_rank
      maximum_retained_samples: 128
      crop_rule: square_longest_detector_side_scaled_translated_within_frame
      crop_scale: 1.5
      minimum_crop_side_pixels: 32
      subject_role: candidate
  active_interview_audio_context:
    speaker_claim: none
    boundary_source: candidate_face_active_interval
    sample_rate: 16000
    nonoverlap_window_seconds: 20
    maximum_windows: 16
    maximum_selected_seconds: 320
    selection: if_n_le_cap_all_else_floor_j_times_n_minus_1_over_cap_minus_1
    spans_first_and_last_window: true
    partial_final_window: retain_if_nonempty
    embedded_audio_time_base: 3/125
    supplied_audio_time_base: 1/48000
    end_alignment: allow_end_of_stream_shortfall_below_one_source_audio_tick
    encode_each_window_separately: true
    persist_full_and_active_duration_and_selected_indices: true
    complete_active_interval_representation_claim: false
  candidate_speech_segments_sensitivity:
    optional: true
    absence_blocks_core: false
  write:
    shard_format: deterministic_uncompressed_npz
    sidecar_format: canonical_json
    atomic: true
    resume_requires_full_fingerprint_and_checksum_validation: true

complete_pair_eligibility:
  unit: participant
  rule: both_pre_and_post_sessions_have_all_three_frozen_modality_summaries
  required_modalities: [video, interview_audio, candidate_text]
  determined_without: [outcome, protected_annotation]
  imputation: forbidden
  hash_before_training: true
  retain_original_fold_and_random_proxy_assignments_without_reranking: true
  report: [eligible_participants, eligible_participants_per_fold, exclusion_failures]
  oof_session_predictions_per_configuration_seed: two_times_eligible_participants
  participant_bootstrap_size: eligible_participants

